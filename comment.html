<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comments</title>
</head>
<body>
    <button id="load-comments" type="button">Load Disqus comments</button>
    <div id="disqus_thread"></div>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    <script>
        window.disqus_config = function () {
            this.page.url = 'https://alexlamson.com/comment.html';
            this.page.identifier = 'http://alexlamson.com/comment/1';
        };
        const button = document.getElementById('load-comments');
        button.addEventListener('click', () => {
            button.disabled = true;
            const script = document.createElement('script');
            script.src = 'https://alexlamson-com.disqus.com/embed.js';
            script.referrerPolicy = 'no-referrer';
            script.addEventListener('load', () => { button.hidden = true; });
            script.addEventListener('error', () => {
                script.remove();
                button.textContent = 'Retry loading Disqus comments';
                button.disabled = false;
            });
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
